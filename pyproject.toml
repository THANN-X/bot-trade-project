[project]
name = "tradebot"
version = "0.1.0"
description = "บอทวิเคราะห์และเทรดแบบมีระบบ — ฝึกบนคริปโต"
requires-python = ">=3.12,<3.13"
dependencies = [
    "ccxt",
    "pandas",
    "matplotlib",
    "pyyaml",
    "python-dotenv",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tradebot"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
